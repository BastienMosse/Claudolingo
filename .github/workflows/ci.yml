name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compile
        run: npm run build

      - name: Package VSIX
        run: npx vsce package -o claudolingo-${{ github.sha }}.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: claudolingo-vsix
          path: "*.vsix"
          retention-days: 14
