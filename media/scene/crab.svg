<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!--
    The crab. Colors come from CSS variables (see scene.css) through the c-* classes,
    so the crab can turn redder when it gets angry. The fill/stroke attributes are only a fallback.
    Animated parts are wrapped in a <g transform> so CSS can rotate them around their local origin.
    Claws are drawn in local coords: hinge at (0,0), fingers pointing to +x,
    movable finger (jaw-top) on -y, big finger (jaw-bot) on +y, static palm in between.
    Mood-only parts (extra mouths, steam, sparkles, question marks) are hidden with presentation
    attributes so the file looks clean on its own; scene.css overrides them per mood.
  -->
  <defs>
    <clipPath id="crab-face-clip">
      <rect x="170" y="180" width="204" height="172" rx="13"/>
    </clipPath>
  </defs>

  <ellipse class="crab-shadow" cx="262" cy="403" rx="158" ry="14" fill="#000000" opacity="0.12"/>

  <g id="crab" class="crab-hit">
    <g class="crab-jump">
      <g class="crab-root">

        <g class="crab-legs" fill="none" stroke="#ce4224" stroke-width="23" stroke-linecap="round">
          <path class="c-limb leg leg-1" d="M 154 340 Q 135 352 133 396"/>
          <path class="c-limb leg leg-2" d="M 186 344 Q 172 358 171 396"/>
          <path class="c-limb leg leg-3" d="M 332 344 Q 343 358 344 396"/>
          <path class="c-limb leg leg-4" d="M 366 340 Q 384 352 386 396"/>
        </g>

        <!-- Left arm, hanging down (shoulder pivot hidden behind the body) -->
        <g transform="translate(152 282)">
          <g class="crab-arm crab-arm-l">
            <path class="c-limb" d="M 0 0 C -30 -12 -58 -10 -72 14" fill="none" stroke="#ce4224" stroke-width="21" stroke-linecap="round"/>
            <g transform="translate(-74 68) rotate(95) scale(0.9)">
              <g class="claw">
                <g class="jaw jaw-top">
                  <path class="c-dark" d="M -6.1 0.1 L 37.3 -9.2 Q 44 -10 41.9 -15.4 C 34.1 -36.6 15.5 -49.2 -13.5 -41.2 C -28.1 -37.6 -37.5 -28.6 -38.9 -16 Z" fill="#ce4224"/>
                </g>
                <path class="c-main" d="M -29.5 -36.5 A 41.7 28.3 88 1 1 -26.6 46.7 A 41.7 28.3 88 1 1 -29.5 -36.5 Z" fill="#ed633e"/>
                <g class="jaw jaw-bot">
                  <path class="c-main" d="M -2.9 -0.9 Q 1 3.2 8.1 3.6 L 49.4 7.6 Q 57.8 9.4 54.7 16.4 C 45.5 34.9 26.2 48.6 2.7 51.5 C -19 54.6 -37.3 46.3 -48.4 27 L -30.2 -4.7 Z" fill="#ed633e"/>
                  <path class="c-hl" d="M 34.4 27 Q 15.4 36.2 -5.6 33.1" fill="none" stroke="#f68062" stroke-width="9" stroke-linecap="round"/>
                </g>
              </g>
            </g>
          </g>
        </g>

        <!-- Right arm, raised -->
        <g transform="translate(366 290)">
          <g class="crab-arm crab-arm-r">
            <path class="c-limb" d="M 0 0 C 34 14 54 34 80 26 C 98 20 106 4 112 -16" fill="none" stroke="#ce4224" stroke-width="21" stroke-linecap="round"/>
            <g transform="translate(128 -54) rotate(-73) scale(0.96)">
              <g class="claw">
                <g class="jaw jaw-top">
                  <path class="c-dark" d="M -6.1 0.1 L 37.3 -9.2 Q 44 -10 41.9 -15.4 C 34.1 -36.6 15.5 -49.2 -13.5 -41.2 C -28.1 -37.6 -37.5 -28.6 -38.9 -16 Z" fill="#ce4224"/>
                </g>
                <path class="c-main" d="M -29.5 -36.5 A 41.7 28.3 88 1 1 -26.6 46.7 A 41.7 28.3 88 1 1 -29.5 -36.5 Z" fill="#ed633e"/>
                <g class="jaw jaw-bot">
                  <path class="c-main" d="M -2.9 -0.9 Q 1 3.2 8.1 3.6 L 49.4 7.6 Q 57.8 9.4 54.7 16.4 C 45.5 34.9 26.2 48.6 2.7 51.5 C -19 54.6 -37.3 46.3 -48.4 27 L -30.2 -4.7 Z" fill="#ed633e"/>
                  <path class="c-hl" d="M 34.4 27 Q 15.4 36.2 -5.6 33.1" fill="none" stroke="#f68062" stroke-width="9" stroke-linecap="round"/>
                </g>
              </g>
            </g>
          </g>
        </g>

        <g class="crab-body">
          <rect class="c-dark" x="124" y="246" width="26" height="48" rx="7" fill="#ce4224"/>
          <rect class="c-dark" x="138" y="180" width="60" height="172" rx="13" fill="#ce4224"/>
          <rect class="c-main" x="170" y="180" width="204" height="172" rx="13" fill="#ed633e"/>
          <rect class="c-main" x="141" y="246" width="255" height="48" rx="8" fill="#ed633e"/>
          <path class="c-light" d="M 208 352 A 66 71 0 0 1 340 352 Z" fill="#f68658"/>

          <g clip-path="url(#crab-face-clip)">
            <g class="crab-face">
              <g class="crab-eye">
                <circle cx="228" cy="236" r="26.5" fill="#ffffff"/>
                <g class="crab-pupil">
                  <circle cx="234" cy="238" r="11" fill="#434343"/>
                </g>
              </g>
              <g class="crab-eye">
                <circle cx="316" cy="236" r="26.5" fill="#ffffff"/>
                <g class="crab-pupil">
                  <circle cx="310" cy="238" r="11" fill="#434343"/>
                </g>
              </g>

              <!-- Brow + eyelid: the lid (body colored) slides over the eye when the brow drops -->
              <g transform="translate(228 206)">
                <g class="crab-brow crab-brow-l">
                  <rect class="c-main" x="-40" y="-36" width="80" height="36" fill="#ed633e"/>
                  <path class="c-brow" d="M -25 0 L 25 0" stroke="#c23b21" stroke-width="10" stroke-linecap="round"/>
                </g>
              </g>
              <g transform="translate(316 206)">
                <g class="crab-brow crab-brow-r">
                  <rect class="c-main" x="-40" y="-36" width="80" height="36" fill="#ed633e"/>
                  <path class="c-brow" d="M -25 0 L 25 0" stroke="#c23b21" stroke-width="10" stroke-linecap="round"/>
                </g>
              </g>

              <g class="crab-mouths">
                <path class="mouth mouth-chill" opacity="0" d="M 248 284 L 298 284 Q 297 311 273 312 Q 249 311 248 284 Z" fill="#a8301b" stroke="#a8301b" stroke-width="5" stroke-linejoin="round"/>
                <path class="mouth mouth-waiting c-brow" d="M 257 292 L 289 292" fill="none" stroke="#c23b21" stroke-width="9" stroke-linecap="round"/>
                <path class="mouth mouth-impatient c-brow" opacity="0" d="M 250 294 Q 261 284 273 293 Q 285 302 296 291" fill="none" stroke="#c23b21" stroke-width="9" stroke-linecap="round"/>
                <path class="mouth mouth-angry c-brow" opacity="0" d="M 202 260 C 204 268 210 273 222 273 C 241 272 254 274 270 288" fill="none" stroke="#c23b21" stroke-width="9" stroke-linecap="round"/>
                <g class="mouth mouth-unhinged" opacity="0">
                  <path d="M 248 308 Q 250 278 273 278 Q 296 278 298 308 Z" fill="#8f2814"/>
                  <path d="M 256 284 Q 273 278 290 284 L 288 291 L 258 291 Z" fill="#ffffff"/>
                </g>
                <ellipse class="mouth mouth-lost" opacity="0" cx="273" cy="293" rx="7.5" ry="9" fill="#a8301b"/>
              </g>
            </g>
          </g>
        </g>

        <!-- Mood props (hidden by default, shown by scene.css per mood) -->
        <g class="crab-steam" display="none" fill="#ffffff">
          <g transform="translate(192 172)"><circle class="puff p1" r="9"/><circle class="puff p2" cx="-8" cy="4" r="7"/></g>
          <g transform="translate(352 172)"><circle class="puff p3" r="9"/><circle class="puff p4" cx="8" cy="4" r="7"/></g>
        </g>

        <g class="crab-sparkles" display="none" fill="#ffc800">
          <g transform="translate(106 214)"><path class="sparkle s1" d="M 0 -11 Q 2 -2 11 0 Q 2 2 0 11 Q -2 2 -11 0 Q -2 -2 0 -11 Z"/></g>
          <g transform="translate(414 330)"><path class="sparkle s2" d="M 0 -9 Q 2 -2 9 0 Q 2 2 0 9 Q -2 2 -9 0 Q -2 -2 0 -9 Z"/></g>
          <g transform="translate(205 160)"><path class="sparkle s3" d="M 0 -8 Q 1.6 -1.6 8 0 Q 1.6 1.6 0 8 Q -1.6 1.6 -8 0 Q -1.6 -1.6 0 -8 Z"/></g>
        </g>

        <g class="crab-question" display="none" fill="#ff9600" font-family="Nunito, sans-serif" font-weight="900" text-anchor="middle">
          <g transform="translate(116 172)"><text class="q q1" font-size="58">?</text></g>
          <g transform="translate(158 128)"><text class="q q2" font-size="36">?</text></g>
        </g>

      </g>
    </g>
  </g>
</svg>
