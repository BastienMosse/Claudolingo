<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- Background: sky, clouds, back bushes, ground, grass -->
  <defs>
    <linearGradient id="sky-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3eafc"/>
      <stop offset="1" stop-color="#e6f8ff"/>
    </linearGradient>
    <linearGradient id="ground-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#95d936"/>
      <stop offset="1" stop-color="#7bc322"/>
    </linearGradient>
  </defs>

  <g id="sky">
    <rect width="800" height="330" fill="url(#sky-grad)"/>
    <!-- Turns the sky red when the crab loses it -->
    <rect class="sky-alert" width="800" height="330" fill="#ff3b2f"/>

    <g transform="translate(190 22)">
      <g class="cloud cloud-1" fill="#ffffff">
        <circle cx="0" cy="0" r="16"/><circle cx="22" cy="-9" r="22"/><circle cx="48" cy="0" r="16"/>
        <rect x="0" y="-2" width="48" height="18"/>
      </g>
    </g>
    <g transform="translate(352 238)">
      <g class="cloud cloud-2" fill="#ffffff">
        <circle cx="0" cy="0" r="13"/><circle cx="18" cy="-8" r="18"/><circle cx="38" cy="0" r="13"/>
        <rect x="0" y="-2" width="38" height="15"/>
      </g>
    </g>
    <g transform="translate(720 230)">
      <g class="cloud cloud-3" fill="#ffffff">
        <circle cx="0" cy="0" r="18"/><circle cx="25" cy="-10" r="24"/><circle cx="54" cy="0" r="18"/>
        <rect x="0" y="-2" width="54" height="20"/>
      </g>
    </g>
    <g transform="translate(560 18)">
      <g class="cloud cloud-4" fill="#ffffff">
        <circle cx="0" cy="0" r="11"/><circle cx="15" cy="-6" r="15"/><circle cx="32" cy="0" r="11"/>
        <rect x="0" y="-2" width="32" height="13"/>
      </g>
    </g>

    <g class="bushes-back" fill="#4b9b69">
      <circle cx="0" cy="306" r="46"/>
      <circle cx="56" cy="292" r="42"/>
      <circle cx="108" cy="308" r="32"/>
      <circle cx="530" cy="312" r="30"/>
      <circle cx="580" cy="298" r="40"/>
      <circle cx="640" cy="284" r="48"/>
      <circle cx="712" cy="288" r="50"/>
      <circle cx="790" cy="300" r="46"/>
    </g>
    <g fill="#5aac78">
      <circle cx="48" cy="272" r="12"/>
      <circle cx="632" cy="262" r="14"/>
      <circle cx="704" cy="266" r="12"/>
    </g>

    <rect y="318" width="800" height="132" fill="url(#ground-grad)"/>
    <rect y="318" width="800" height="5" fill="#a6e24e"/>

    <g fill="#69b81c">
      <g transform="translate(36 404)"><path class="tuft" d="M -9 0 Q -12 -16 -6 -25 Q -3 -12 -1 0 Z M 2 0 Q 4 -20 12 -30 Q 9 -13 9 0 Z"/></g>
      <g transform="translate(498 384)"><path class="tuft tuft-b" d="M -9 0 Q -12 -16 -6 -25 Q -3 -12 -1 0 Z M 2 0 Q 4 -20 12 -30 Q 9 -13 9 0 Z"/></g>
      <g transform="translate(530 392)"><path class="tuft" d="M -6 0 Q -8 -12 -4 -18 Q -2 -9 0 0 Z M 2 0 Q 4 -14 9 -21 Q 7 -9 7 0 Z"/></g>
      <g transform="translate(420 438)"><path class="tuft tuft-b" d="M -6 0 Q -8 -12 -4 -18 Q -2 -9 0 0 Z M 2 0 Q 4 -14 9 -21 Q 7 -9 7 0 Z"/></g>
    </g>
  </g>
</svg>
